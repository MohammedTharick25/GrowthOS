<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#345d4b" />
    <title>Offline · GrowthOS</title>
    <style>
      :root{color-scheme:light dark;font-family:system-ui,sans-serif;background:#f7f5f0;color:#242b28}*{box-sizing:border-box}body{display:grid;min-height:100dvh;margin:0;padding:1.5rem;place-items:center}.card{width:min(100%,30rem);padding:2rem;border:1px solid #e3e7df;border-radius:1.5rem;background:#fffefa;text-align:center;box-shadow:0 1rem 3rem #263b2c12}.mark{display:grid;width:3.5rem;height:3.5rem;margin:0 auto 1rem;place-items:center;border-radius:1.25rem;background:#345d4b;color:#f7f5f0;font-size:1.75rem}h1{margin:.4rem 0;font-size:1.65rem;letter-spacing:-.04em}p{margin:0;color:#626e65;line-height:1.65;font-size:.95rem}button{min-height:2.75rem;margin-top:1.5rem;padding:0 1.25rem;border:0;border-radius:99rem;background:#345d4b;color:white;font-size:.9rem;font-weight:700}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){background:#171d1a;color:#edf0eb}.card{border-color:#354139;background:#202824}p{color:#a4aea6}}
    </style>
  </head>
  <body><main class="card"><span class="mark" aria-hidden="true">↗</span><h1>You’re offline</h1><p>Your account data isn’t cached for offline launch. If Today is already open, habit check-ins can sync when you reconnect. Other changes need a connection.</p><button type="button" onclick="location.reload()">Try again</button></main></body>
</html>
